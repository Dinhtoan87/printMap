# Tiện ích Docker cho pipeline dữ liệu + PostGIS (tùy chọn).
# Không bắt buộc chạy để dev app; chỉ dùng khi xử lý dữ liệu .gdb / postgres.
#
#   docker compose run --rm gdal ogrinfo /data/raw/xxx.gdb
#   docker compose run --rm tippecanoe --version
#   docker compose up -d postgis
services:
  # GDAL: đọc .gdb, reproject, xuất GeoJSON. Mount toàn repo vào /work.
  gdal:
    image: ghcr.io/osgeo/gdal:alpine-small-latest
    working_dir: /work
    volumes:
      - ./:/work
    entrypoint: [""]

  # tippecanoe: GeoJSON -> .pmtiles / .mbtiles
  tippecanoe:
    image: klokantech/tippecanoe:latest
    working_dir: /work
    volumes:
      - ./:/work
    entrypoint: [""]

  # Martin tile server: tự publish các bảng PostGIS thành vector tiles
  # (mỗi bảng -> nguồn /<ten_bang>/{z}/{x}/{y}, source-layer = ten_bang) và phục vụ
  # cả *.mbtiles trong ./data/tiles. Style production (styles/style.json) trỏ
  # __MARTIN__ vào server này (API thay bằng env MARTIN_URL, mặc định :3000).
  martin:
    image: ghcr.io/maplibre/martin:latest
    environment:
      # Postgres chạy TRÊN HOST -> dùng host.docker.internal (Windows/macOS).
      # Nếu Postgres cũng trong docker (vd container infra-postgres-1), đổi host cho đúng
      # và nối network ở phần dưới.
      DATABASE_URL: ${DATABASE_URL:-postgresql://mapviet:mapviet_dev_password@host.docker.internal:5432/printdb}
    command: ["--listen-addresses", "0.0.0.0:3000", "/tiles"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/tiles:/tiles
    ports:
      # Host :3000 -> Martin. API Elysia chạy ở :3001 (apps/api/.env: PORT=3001).
      - "3000:3000"
    # Nếu Postgres nằm trong 1 compose stack khác, dùng network external thay cho extra_hosts:
    # networks:
    #   - default
    #   - infra
  # networks:
  #   infra:
  #     external: true
  #     name: infra_default

  # PostGIS (tùy chọn) nếu sau này bạn dùng postgres thay .gdb
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
      POSTGRES_DB: gis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
